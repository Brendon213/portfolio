# Server config for the static portfolio.
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic safe headers for a static site. No CSP: the page relies on a local
    # inline progressive-enhancement snippet (<script> in <head>) that must keep working.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Missing files return 404 — no SPA fallback, no silent index rewrite.
    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets: long-lived caching via `expires` (sets Expires + Cache-Control)
    # without add_header, so the safe headers above stay inherited here.
    location ~* \.(?:css|js|mjs|svg|webp|png|jpe?g|gif|ico|avif|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Never serve dotfiles (e.g. .gitkeep) or hidden paths.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
