name: portfolio

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-nginx:local
    container_name: portfolio
    restart: unless-stopped
    ports:
      # Binds 0.0.0.0 by default so the site is reachable from LAN/WAN.
      # To restrict to localhost only during local development:
      #   PORTFOLIO_HOST=127.0.0.1 docker compose up -d
      - "${PORTFOLIO_HOST:-0.0.0.0}:${PORTFOLIO_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:80/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
